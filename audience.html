<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience Choice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Innovation Jam logo colors */
    --blue:#0C3662; --blue-deep:#062F58; --blue-light:#2C61A1;
    --maize:#F1C319; --maize-soft:#FDF4CF;
    --bg:#F3F5F8; --card:#fff; --ink:#0C3662; --muted:#5B6B7F; --line:#DDE3EA;
    --accent:#0C3662; --accent-soft:#E4EBF4;
    --ok:#18794e; --ok-soft:#e3f4ea; --danger:#b42318; --danger-soft:#fde8e7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  header{background:var(--blue);color:#fff;padding:10px 16px;font-weight:700;border-bottom:4px solid var(--maize)}
  .hbar{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
  .brand{display:flex;align-items:center;min-width:0}
  .brand img{height:46px;width:auto;flex:none;display:block}
  .hright{margin-left:auto;font-size:13px;font-weight:600;color:var(--blue);background:var(--maize);border-radius:999px;padding:4px 12px}
  h1{font-size:24px;margin:0 0 6px}
  h2{font-size:17px;margin:0}
  p{margin:0 0 20px;color:var(--muted)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px}
  .link{color:var(--accent);font-size:14px;font-weight:600;padding:4px 0}
  @media (max-width:400px){ .brand img{height:40px} }
  main{max-width:440px;margin:0 auto;padding:24px 20px 60px}
  .intro{margin-bottom:22px}
  .intro h1{font-size:30px;margin:0 0 8px}
  .intro p{margin:0;font-size:16px;color:var(--blue)}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .list-head h2{font-size:16px}
  .list-head span{font-size:13px;color:var(--muted)}
  .team{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
  .team:hover{border-color:var(--accent)}
  .num{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
  .team .info{flex:1;min-width:0}
  .team .info b{display:block}
  .team .info span{font-size:13px;color:var(--muted)}
  .pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f0efea;color:var(--muted);white-space:nowrap}
  .pill.done{background:var(--ok-soft);color:var(--ok)}
  .empty{border:1.5px dashed #c6ced8;border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
  .eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 2px}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .cat-q{font-weight:600;font-size:15.5px}
  .scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .scale button{padding:13px 4px;min-height:54px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;line-height:1.2}
  .scale button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .status{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14.5px}
  .status.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
  .status.ok span{display:block;font-weight:500;font-size:13px;margin-top:2px}
  .status.wait{background:var(--accent-soft);color:var(--muted)}
  .status.err{background:var(--danger-soft);color:var(--danger)}
  .status.err button{background:var(--danger);color:#fff;border-radius:8px;padding:7px 12px;margin-top:8px;font-size:14px;font-weight:600}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
  .center{text-align:center}
  .center p{margin-bottom:14px}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="hbar">
  <div class="brand"><img src="assets/logo-white.png" alt="Business+Tech Innovation Jam"></div>
</div></header>
<main id="app"></main>
<script src="audience-config.js"></script>
<script>
const QUESTIONS = [
  { id:'q1', text:'If you were the target audience, would you pay for what they ask for?', labels:['Probably not','Maybe','Absolutely'] },
  { id:'q2', text:'How was the demo?', labels:['Getting there','Great','Wow'] }
];

/* ---------- local storage (this phone only) ---------- */
const mem = {};
const local = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return k in mem?mem[k]:d; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let device = local.get('jamac-device', null);
if(!device){
  device = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12));
  local.set('jamac-device', device);
}
let booths = local.get('jamac-booths', {});   // code -> {name, q1, q2, saved}
const saveBooths = () => local.set('jamac-booths', booths);

/* ---------- server ---------- */
async function api(params, post){
  let r;
  if(post) r = await fetch(API_URL, { method:'POST', body: JSON.stringify(params) });   // text/plain: no preflight
  else r = await fetch(API_URL + '?' + new URLSearchParams(params));
  const j = await r.json();
  if(j.ok === false) throw new Error(j.error || 'Something went wrong');
  return j;
}

/* ---------- views ---------- */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current = null;   // {code, name, q1, q2, state:'idle'|'saving'|'saved'|'error', msg}

function route(){
  window.scrollTo(0,0);
  const m = location.hash.match(/^#b-([a-z0-9]+)$/);
  if(m) return openBooth(m[1]);
  current = null;
  renderHome();
}
window.addEventListener('hashchange', route);

function renderHome(){
  const codes = Object.keys(booths);
  const rated = codes.filter(c=>booths[c].saved).length;
  const total = Number(local.get('jamac-total', 0)) || 0;   // falls back to booths visited until the script is updated
  $app.innerHTML = `
    <div class="intro">
      <h1>Audience Choice</h1>
      <p>Visit the demos and scan the QR code on each team's table. Two quick taps and you're done.</p>
    </div>
    <div class="list-head"><h2>Booths you've visited</h2><span>${codes.length?`${rated} of ${Math.max(total, codes.length)} rated`:''}</span></div>
    ${codes.length ? codes.map(c=>`<button class="team" onclick="location.hash='b-${c}'">
        <span class="num">${esc(booths[c].name.replace(/^Team\s+/i,'').slice(0,2))}</span>
        <span class="info"><b>${esc(booths[c].name)}</b><span>${booths[c].saved?'Tap to change your rating':'Tap to rate'}</span></span>
        <span class="pill ${booths[c].saved?'done':''}">${booths[c].saved?'Rated ✓':'Not rated'}</span></button>`).join('')
      : `<div class="empty"><b>No booths yet</b>Open your phone camera and point it at the QR code on a team's table. Only teams you visit show up here.</div>`}`;
}

function renderMessage(title, body, retry){
  $app.innerHTML = `<div class="card center"><h1>${title}</h1>
    <p>${body}</p>
    ${retry?`<button class="link" onclick="route()">Try again</button> · `:''}<button class="link" onclick="location.hash=''">My booths</button></div>`;
}

async function openBooth(code){
  const known = booths[code];
  current = { code, name: known?.name || '', q1: known?.q1 || null, q2: known?.q2 || null, state: known?.saved ? 'saved' : 'idle' };
  if(known) renderTeam();
  else $app.innerHTML = `<div class="card center"><div class="spinner"></div><p style="margin:0">Loading team…</p></div>`;
  let info;
  try{ info = await api({ action:'team', code }); }
  catch(e){
    if(current?.code !== code) return;
    if(/not found/i.test(e.message)) return renderMessage("That code didn't work", "Try scanning the QR code on the team's table again.");
    if(!known) return renderMessage("Couldn't connect", "Check your signal or Wi-Fi and try again.", true);
    return;
  }
  if(current?.code !== code) return;
  if(info.round && local.get('jamac-round', null) !== info.round){   // votes were cleared since this phone last voted
    booths = {}; saveBooths(); local.set('jamac-round', info.round);
    current.q1 = current.q2 = null; current.state = 'idle';
  }
  if(info.total) local.set('jamac-total', info.total);   // how many teams there are in all
  if(!info.open) return renderMessage('Voting is closed', 'Thanks for taking part! Results will be announced shortly.');
  current.name = info.team.name;
  if(!booths[code]){
    booths[code] = { name: info.team.name };
    api({ action:'scan', code, device }, true).catch(()=>{});
  } else booths[code].name = info.team.name;
  saveBooths();
  renderTeam();
}

function renderTeam(){
  const c = current;
  const status = {
    idle:  `<div class="hint">Your rating saves as soon as you answer both.</div>`,
    saving:`<div class="status wait">Saving…</div>`,
    saved: `<div class="status ok">✓ Saved. Head to another booth and scan its code.<span>Changed your mind? Just tap a different answer.</span></div>`,
    error: `<div class="status err">${esc(c.msg||"Didn't save.")}<br><button onclick="send()">Try again</button></div>`
  }[c.state];
  $app.innerHTML = `
    <button class="link" onclick="location.hash=''">← My booths</button>
    <div class="eyebrow">You're rating</div>
    <h1 style="margin-bottom:16px">${esc(c.name)}</h1>
    ${QUESTIONS.map(q=>`<div class="cat"><div class="cat-q">${esc(q.text)}</div>
      <div class="scale">${q.labels.map((l,k)=>`<button class="${c[q.id]===k+1?'on':''}" onclick="pick('${q.id}',${k+1})">${esc(l)}</button>`).join('')}</div></div>`).join('')}
    ${status}`;
}

function pick(q,v){
  current[q] = v;
  if(current.state === 'saving'){ renderTeam(); return; }   // the save in progress will resend
  if(current.q1 && current.q2) send(); else renderTeam();
}
async function send(){
  const c = current, sent = { q1:c.q1, q2:c.q2 };
  c.state = 'saving'; renderTeam();
  try{
    await api({ action:'rate', code:c.code, device, q1:sent.q1, q2:sent.q2 }, true);
    booths[c.code] = { name:c.name, q1:sent.q1, q2:sent.q2, saved:true }; saveBooths();
    if(current !== c) return;
    if(c.q1!==sent.q1 || c.q2!==sent.q2) return send();      // they changed an answer mid-save
    c.state = 'saved'; renderTeam();
  }catch(e){
    if(current !== c) return;
    c.state = 'error';
    c.msg = /closed/i.test(e.message) ? 'Voting has closed, so this rating could not be saved.'
          : "Didn't save. Check your signal and try again.";
    renderTeam();
  }
}

route();
</script>
</body>
</html>
