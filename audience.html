<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience Choice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f4f0;--card:#fff;--ink:#1b1d24;--muted:#6b6f7b;--line:#e3e1db;--accent:#2b3fd6;--accent-soft:#e8ebff;
        --ok:#1f7a4d;--ok-soft:#e3f4ea;--warn:#a33a1f;--warn-soft:#fbe9e4;--gold-soft:#fdf3e1}
  *{box-sizing:border-box}
  body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:460px;margin:0 auto;padding:22px 16px 60px}
  .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
  h1{font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:17px;margin:0 0 10px}
  p.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.45}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .booths{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .booth{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:76px}
  .booth b{font-size:16px}
  .booth span{font-size:12px;color:var(--muted)}
  .booth.done{border-color:var(--ok);background:var(--ok-soft)}
  .booth.done span{color:var(--ok)}
  .q{margin:18px 0 6px;font-size:16px;line-height:1.4;font-weight:500}
  .q:first-child{margin-top:4px}
  .scale{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .scale button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 4px;font-weight:700;font-size:15px;line-height:1.2;min-height:62px}
  .scale button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .status{margin-top:20px;border-radius:12px;padding:14px;line-height:1.45;font-size:15px}
  .status.ok{background:var(--ok-soft);color:var(--ok);font-weight:500}
  .status.ok span{display:block;font-weight:400;font-size:13px;color:#3d6b52;margin-top:2px}
  .status.wait{background:#efeee9;color:var(--muted)}
  .status.err{background:var(--warn-soft);color:var(--warn)}
  .status.err button{border:0;background:var(--warn);color:#fff;border-radius:8px;padding:7px 12px;margin-top:8px;font-size:14px}
  .hint{margin-top:20px;font-size:13px;color:var(--muted);text-align:center}
  .link{background:none;border:0;color:var(--accent);padding:0;font-size:14px}
  .center{text-align:center;padding:30px 18px}
  .scanicon{width:46px;height:46px;margin:0 auto 12px;border:3px solid var(--accent);border-radius:10px;position:relative}
  .scanicon::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:3px;background:var(--accent);border-radius:2px}
  .notice{background:var(--gold-soft);color:#7a4f10;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="audience-config.js"></script>
<script>
const QUESTIONS = [
  { id:'q1', text:'If you were the target audience, would you pay for what they ask for?', labels:['Probably not','Maybe','Absolutely'] },
  { id:'q2', text:'How was the demo?', labels:['Getting there','Great','Wow'] }
];

/* ---------- local storage (this phone only) ---------- */
const mem = {};
const local = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return k in mem?mem[k]:d; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let device = local.get('jamac-device', null);
if(!device){
  device = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12));
  local.set('jamac-device', device);
}
let booths = local.get('jamac-booths', {});   // code -> {name, q1, q2, saved}
const saveBooths = () => local.set('jamac-booths', booths);

/* ---------- server ---------- */
async function api(params, post){
  let r;
  if(post) r = await fetch(API_URL, { method:'POST', body: JSON.stringify(params) });   // text/plain: no preflight
  else r = await fetch(API_URL + '?' + new URLSearchParams(params));
  const j = await r.json();
  if(j.ok === false) throw new Error(j.error || 'Something went wrong');
  return j;
}

/* ---------- views ---------- */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current = null;   // {code, name, q1, q2, state:'idle'|'saving'|'saved'|'error', msg}

function route(){
  window.scrollTo(0,0);
  const m = location.hash.match(/^#b-([a-z0-9]+)$/);
  if(m) return openBooth(m[1]);
  current = null;
  renderHome();
}
window.addEventListener('hashchange', route);

function renderHome(){
  const codes = Object.keys(booths);
  const rated = codes.filter(c=>booths[c].saved).length;
  $app.innerHTML = `<div class="wrap">
    <div class="eyebrow">${esc(EVENT_NAME)}</div>
    <h1>Audience Choice</h1>
    <p class="sub">Visit the demos and scan the QR code on each team's table. Two quick taps and you're done. Only teams you've visited show up here.</p>
    ${codes.length ? `
      <div class="eyebrow" style="margin-bottom:8px">Booths you've visited</div>
      <div class="booths">${codes.map(c=>`<button class="booth ${booths[c].saved?'done':''}" onclick="location.hash='b-${c}'">
        <b>${esc(booths[c].name)}</b><span>${booths[c].saved?'✓ Rated · tap to change':'Not rated yet'}</span></button>`).join('')}</div>
      <p class="sub" style="margin-top:14px">You've rated ${rated} team${rated===1?'':'s'}. Scan another booth's code to keep going.</p>`
    : `<div class="card center"><div class="scanicon"></div>
        <h2>No booths yet</h2><p class="sub" style="margin:0">Open your phone camera and point it at the QR code on a team's table.</p></div>`}
  </div>`;
}

function renderMessage(title, body, retry){
  $app.innerHTML = `<div class="wrap"><div class="card center"><h2>${title}</h2>
    <p class="sub">${body}</p>
    ${retry?`<button class="link" onclick="route()">Try again</button> · `:''}<button class="link" onclick="location.hash=''">My booths</button></div></div>`;
}

async function openBooth(code){
  const known = booths[code];
  current = { code, name: known?.name || '', q1: known?.q1 || null, q2: known?.q2 || null, state: known?.saved ? 'saved' : 'idle' };
  if(known) renderTeam();
  else $app.innerHTML = `<div class="wrap"><div class="card center"><div class="spinner"></div><p class="sub" style="margin:0">Loading team…</p></div></div>`;
  let info;
  try{ info = await api({ action:'team', code }); }
  catch(e){
    if(current?.code !== code) return;
    if(/not found/i.test(e.message)) return renderMessage("That code didn't work", "Try scanning the QR code on the team's table again.");
    if(!known) return renderMessage("Couldn't connect", "Check your signal or Wi-Fi and try again.", true);
    return;
  }
  if(current?.code !== code) return;
  if(info.round && local.get('jamac-round', null) !== info.round){   // votes were cleared since this phone last voted
    booths = {}; saveBooths(); local.set('jamac-round', info.round);
    current.q1 = current.q2 = null; current.state = 'idle';
  }
  if(!info.open) return renderMessage('Voting is closed', 'Thanks for taking part! Results will be announced shortly.');
  current.name = info.team.name;
  if(!booths[code]){
    booths[code] = { name: info.team.name };
    api({ action:'scan', code, device }, true).catch(()=>{});
  } else booths[code].name = info.team.name;
  saveBooths();
  renderTeam();
}

function renderTeam(){
  const c = current;
  const status = {
    idle:  `<div class="hint">Your rating saves as soon as you answer both.</div>`,
    saving:`<div class="status wait">Saving…</div>`,
    saved: `<div class="status ok">✓ Saved. Head to another booth and scan its code.<span>Changed your mind? Just tap a different answer.</span></div>`,
    error: `<div class="status err">${esc(c.msg||"Didn't save.")}<br><button onclick="send()">Try again</button></div>`
  }[c.state];
  $app.innerHTML = `<div class="wrap">
    <button class="link" onclick="location.hash=''">← My booths</button>
    <div class="eyebrow" style="margin-top:14px">You're rating</div>
    <h1>${esc(c.name)}</h1>
    <div class="card">
      ${QUESTIONS.map(q=>`<div class="q">${esc(q.text)}</div>
        <div class="scale">${q.labels.map((l,k)=>`<button class="${c[q.id]===k+1?'on':''}" onclick="pick('${q.id}',${k+1})">${esc(l)}</button>`).join('')}</div>`).join('')}
      ${status}
    </div>
  </div>`;
}

function pick(q,v){
  current[q] = v;
  if(current.state === 'saving'){ renderTeam(); return; }   // the save in progress will resend
  if(current.q1 && current.q2) send(); else renderTeam();
}
async function send(){
  const c = current, sent = { q1:c.q1, q2:c.q2 };
  c.state = 'saving'; renderTeam();
  try{
    await api({ action:'rate', code:c.code, device, q1:sent.q1, q2:sent.q2 }, true);
    booths[c.code] = { name:c.name, q1:sent.q1, q2:sent.q2, saved:true }; saveBooths();
    if(current !== c) return;
    if(c.q1!==sent.q1 || c.q2!==sent.q2) return send();      // they changed an answer mid-save
    c.state = 'saved'; renderTeam();
  }catch(e){
    if(current !== c) return;
    c.state = 'error';
    c.msg = /closed/i.test(e.message) ? 'Voting has closed, so this rating could not be saved.'
          : "Didn't save. Check your signal and try again.";
    renderTeam();
  }
}

route();
</script>
</body>
</html>
