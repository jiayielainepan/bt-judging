<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B+T Judging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f4f0;
      --card: #ffffff;
      --ink: #15213b;
      --muted: #667085;
      --line: #e4e2db;
      --accent: #2a55c4;
      --accent-soft: #e8eefc;
      --danger: #b42318;
      --danger-soft: #fde8e7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    header {
      background: var(--ink);
      color: #fff;
      padding: 14px 20px;
      font-weight: 700;
    }
    header small { display: block; font-weight: 500; opacity: .7; font-size: 12px; }
    main { max-width: 440px; margin: 0 auto; padding: 28px 20px 40px; }
    main.wide { max-width: 1100px; }
    .hbar { display: flex; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto; }
    .view-tabs { margin-left: auto; display: flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
    .view-tabs button { color: #fff; opacity: .75; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .view-tabs button.on { background: #fff; color: var(--ink); opacity: 1; }

    /* Panel */
    .lockbox { max-width: 400px; margin: 30px auto 0; }
    .err { color: var(--danger); font-size: 14px; margin: 10px 0 0; }
    .ptop { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .live { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .live .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
    .live.stale .dot { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.2); }
    .lock-btn { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 600; }
    .reset-row { margin-top: 26px; text-align: center; }
    .reset-btn { color: var(--danger); font-size: 13px; font-weight: 600; padding: 8px 12px; border: 1px solid #f4c7c3; border-radius: 10px; background: #fff; }
    .reset-btn:hover { background: var(--danger-soft); }
    .danger { background: var(--danger) !important; }
    .jchips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .jchip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
    .jchip b { font-weight: 600; }
    .jchip .jbar { display: inline-block; width: 46px; height: 5px; background: #eceae4; border-radius: 9px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
    .jchip .jbar i { display: block; height: 100%; background: var(--accent); }
    .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .pcard h2 { font-size: 17px; margin: 0; }
    .pscroll { overflow-x: auto; margin-top: 10px; }
    .ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ptable th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .ptable td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
    .ptable tr[data-pteam] { cursor: pointer; }
    .ptable tr[data-pteam]:hover td { background: #faf9f6; }
    .ptable .c { text-align: center; font-variant-numeric: tabular-nums; }
    .tlink { color: var(--accent); font-weight: 600; }
    .tt { display: inline-block; min-width: 40px; padding: 3px 7px; border-radius: 8px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
    .tt.standout { background: #e3f4ea; color: #18794e; }
    .tt.solid { background: #fff4d6; color: #9a6700; }
    .tt.needs { background: #fdeee3; color: #b54708; }
    .tt.none { color: var(--muted); }
    .zv { font-weight: 700; font-variant-numeric: tabular-nums; }
    .zv.pos { color: #18794e; } .zv.neg { color: #b54708; }
    .legend { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .legend .l1::before { background: #e3f4ea; border: 1px solid #18794e; }
    .legend .l2::before { background: #fff4d6; border: 1px solid #9a6700; }
    .legend .l3::before { background: #fdeee3; border: 1px solid #b54708; }
    .pm-bg { position: fixed; inset: 0; background: rgba(21,33,59,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
    .pm { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px; padding: 18px; }
    .pm .pcard { margin-bottom: 12px; }
    .pm h3 { font-size: 14px; margin: 0 0 10px; }
    .meter { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
    .meter .lbl { width: 84px; flex: none; }
    .meter .trk { flex: 1; height: 8px; background: #efede7; border-radius: 9px; overflow: hidden; }
    .meter .trk i { display: block; height: 100%; background: var(--accent); }
    .meter .v { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    .quote { font-size: 14px; border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 8px 0; }
    .quote small { display: block; color: var(--muted); font-size: 12px; }
    .ngroup { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 6px; }
    .ngroup:first-of-type { margin-top: 0; }
    .ngroup.keep { color: #18794e; } .ngroup.work { color: #b54708; }
    .nlist { display: flex; flex-wrap: wrap; gap: 6px; }
    .nchip { font-size: 13px; padding: 5px 10px; border-radius: 999px; }
    .nchip.keep { background: #e3f4ea; color: #18794e; } .nchip.work { background: #fdeee3; color: #b54708; }
    .nchip small { opacity: .75; margin-left: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 20px;
    }
    h1 { font-size: 24px; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    input {
      width: 100%;
      font: inherit;
      font-size: 17px;          /* 16px+ stops iPhones from zooming in */
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    input:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
    .primary {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-weight: 600;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
    }
    .primary:disabled { opacity: .4; cursor: not-allowed; }
    .link { color: var(--accent); font-size: 14px; font-weight: 600; padding: 4px 0; }
    .hidden { display: none !important; }

    /* Home screen */
    .hello { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .hello h1 { margin: 0; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    .sync { font-size: 13px; margin: -12px 0 18px; color: var(--muted); }
    .sync.ok { color: #18794e; }
    .sync.warn { color: #b54708; }
    .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .list-head h2 { font-size: 16px; margin: 0; }
    .plus {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-size: 24px; line-height: 1; display: grid; place-items: center;
    }
    .team {
      display: flex; align-items: center; gap: 12px;
      width: 100%; text-align: left;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 8px;
    }
    .team:hover { border-color: var(--accent); }
    .num {
      width: 40px; height: 40px; border-radius: 11px; flex: none;
      display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); font-weight: 700;
    }
    .team .info { flex: 1; min-width: 0; }
    .team .info b { display: block; }
    .team .info span { font-size: 13px; color: var(--muted); }
    .status { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #f0efea; color: var(--muted); white-space: nowrap; }
    .remove {
      width: 32px; height: 32px; border-radius: 9px; flex: none;
      color: var(--muted); font-size: 20px; display: grid; place-items: center;
    }
    .remove:hover { background: var(--danger-soft); color: var(--danger); }
    .add-row {
      width: 100%; padding: 14px; border-radius: 14px;
      border: 1.5px dashed #cfcac0; color: var(--accent); font-weight: 600;
    }
    .add-row:hover { background: var(--accent-soft); border-color: var(--accent); }

    /* Bottom sheet (placeholder for scoring) */
    .sheet-bg { position: fixed; inset: 0; background: rgba(21,33,59,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
    .sheet {
      background: var(--bg); width: 100%; max-width: 440px;
      border-radius: 20px 20px 0 0; padding: 22px 20px 26px; text-align: center;
    }
    @media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
    .sheet { text-align: left; max-height: 92vh; overflow-y: auto; }
    .sheet-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .sheet-top h2 { margin: 0; flex: 1; font-size: 20px; }
    .cancel { color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 0; }
    .cat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .cat-head { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; }
    .cat-head span { color: var(--muted); font-weight: 500; font-size: 13px; }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
    .scale button { padding: 11px 0; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 16px; }
    .scale button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    textarea {
      width: 100%; font: inherit; font-size: 16px; margin-top: 8px;
      padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px;
      resize: vertical; min-height: 76px; background: #fff; color: var(--ink);
    }
    textarea:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
    .total { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 0; font-weight: 600; }
    .total b { font-size: 22px; }
    .status.done { background: #e3f4ea; color: #18794e; }
    .group { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 6px; }
    .group.keep { color: #18794e; }
    .group.work { color: #b54708; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 7px 12px; border-radius: 999px; font-size: 14px; border: 1px dashed #cfcac0; background: #fff; }
    .chip.keep.on { background: #e3f4ea; border: 1px solid #18794e; color: #18794e; }
    .chip.work.on { background: #fdeee3; border: 1px solid #b54708; color: #b54708; }
    .field-label { font-size: 14px; font-weight: 600; margin-top: 14px; }
    .field-label:first-of-type { margin-top: 4px; }
    .gut { border: 1.5px solid var(--accent); }
    .gut-q { font-weight: 700; font-size: 17px; margin: 2px 0 12px; color: var(--ink); }
    .gut-hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
    .tiers { display: grid; gap: 8px; }
    .tier { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; }
    .tier b { display: block; font-size: 16px; }
    .tier span { font-size: 13px; color: var(--muted); }
    .tier.on.standout { background: #e3f4ea; border-color: #18794e; } .tier.on.standout b { color: #18794e; }
    .tier.on.solid { background: #fff4d6; border-color: #9a6700; } .tier.on.solid b { color: #9a6700; }
    .tier.on.needs { background: #fdeee3; border-color: #b54708; } .tier.on.needs b { color: #b54708; }
    .status.standout { background: #e3f4ea; color: #18794e; }
    .status.solid { background: #fff4d6; color: #9a6700; }
    .status.needs { background: #fdeee3; color: #b54708; }
  </style>
</head>
<body>
  <header><div class="hbar">
    <div>B+T Judging <small>JAM Challenge Round</small></div>
    <div class="view-tabs">
      <button data-view="judge" class="on">Judge</button>
      <button data-view="panel">Panel</button>
    </div>
  </div></header>

  <main>
    <!-- Screen 1: ask for the judge's name -->
    <section id="name-screen" class="card hidden">
      <h1>Welcome, judge</h1>
      <p>Thanks for judging today. Enter your name to get started.</p>
      <form id="name-form">
        <label for="name-input">What's your name?</label>
        <input id="name-input" type="text" autocomplete="name" placeholder="e.g. Sarah Chen" maxlength="60">
        <button id="continue-btn" class="primary" type="submit" disabled>Continue</button>
      </form>
    </section>

    <!-- Screen 2: home, the list of teams in presenting order -->
    <section id="home-screen" class="hidden">
      <div class="hello">
        <h1 id="hello-title">Hi!</h1>
        <button class="link" id="change-name">Not you?</button>
      </div>

      <p class="sync" id="sync-status"></p>
      <div class="list-head">
        <h2 id="team-count">Teams</h2>
        <button class="plus" id="add-team-top" aria-label="Add a team" title="Add a team">+</button>
      </div>
      <div id="team-list"></div>
      <button class="add-row" id="add-team-bottom">+ Add team</button>
    </section>
    <!-- Panel view (password protected) -->
    <section id="panel-screen" class="hidden"></section>
  </main>

  <div id="sheet"></div>
  <div id="panel-modal"></div>

  <script>
    // ---------- Google Sheet connection ----------
    // Paste the Apps Script Web app URL (ends in /exec) between the quotes.
    // Leave it empty and scores are only saved on the judge's phone.
    const API_URL = 'https://script.google.com/macros/s/AKfycbxIwWrOpESXQMDsK5zMzfBxRyQD_zx94BDU1YyTWpLonY3jeED1eOWYungHeXe0Piy3/exec';

    // ---------- Settings ----------
    const STARTING_TEAMS = 5;                 // how many teams to show at first
    const NAME_KEY  = 'bt-judge-name';
    const TEAMS_KEY = 'bt-team-count-v2';
    const SCORES_KEY = 'bt-scores-v1';
    const CATEGORIES = 5;                     // Category 1 through 5
    const MAX_POINTS = 5;                     // each category is out of 5

    // Gut check: judged on the pitch itself, not against other teams.
    const TIERS = [
      { id: 'standout', label: 'Standout',   desc: 'Could win this' },
      { id: 'solid',    label: 'Solid',      desc: 'Good, but not a standout' },
      { id: 'needs',    label: 'Needs work', desc: 'Not ready to advance yet' }
    ];
    const tierOf = id => TIERS.find(t => t.id === id);

    // Quick-tap notes: specific things a 1-5 score can't tell a team. All optional.
    const NOTES = [
      { id: 'demo',   type: 'keep', text: 'Strong live demo' },
      { id: 'evid',   type: 'keep', text: 'Real customer evidence' },
      { id: 'qa',     type: 'keep', text: 'Handled Q&A well' },
      { id: 'story',  type: 'keep', text: 'Memorable story' },
      { id: 'ask',    type: 'keep', text: 'Clear, specific ask' },
      { id: 'team',   type: 'keep', text: 'Team fits the problem' },
      { id: 'nevid',  type: 'work', text: 'Show customer evidence' },
      { id: 'rev',    type: 'work', text: 'Explain how you make money' },
      { id: 'comp',   type: 'work', text: 'Address competitors' },
      { id: 'time',   type: 'work', text: 'Ran over time' },
      { id: 'slides', type: 'work', text: 'Too much text on slides' },
      { id: 'nask',   type: 'work', text: 'Make the ask specific' }
    ];

    // ---------- Saved on this phone ----------
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
    function forget(key) { try { localStorage.removeItem(key); } catch (e) {} }

    let teamCount = parseInt(load(TEAMS_KEY), 10) || STARTING_TEAMS;

    // Judges are recognized by name: entering the same name (on any phone or browser)
    // restores that judge's scores from the Google Sheet.
    // Behind the scenes each judge also gets a random ID, which the Sheet uses to tell rows apart.
    const QUEUE_KEY  = 'bt-send-queue';
    let judgeName = '';
    let deviceId = null;    // this judge's ID for new rows
    let allScores = {};     // this judge's scores: { "3": { tier, scores: {1: 4, ...}, notes, best, improve, savedAt, device } }

    const nameKey = name => name.trim().toLowerCase().replace(/\s+/g, ' ');

    function startJudge(name) {
      judgeName = name;
      const idKey = `bt-judge-id-${nameKey(name)}`;
      deviceId = load(idKey);
      if (!deviceId) {
        deviceId = 'j-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        store(idKey, deviceId);
      }
      try { allScores = JSON.parse(load(`${SCORES_KEY}-name-${nameKey(name)}`)) || {}; } catch (e) { allScores = {}; }
    }
    function saveAllScores() { store(`${SCORES_KEY}-name-${nameKey(judgeName)}`, JSON.stringify(allScores)); }

    // If an organizer reset all data, clear anything on this phone saved before the reset.
    const RESET_SEEN_KEY = 'bt-reset-seen';
    function applyReset(resetAt) {
      resetAt = Number(resetAt) || 0;
      if (!resetAt || resetAt <= (Number(load(RESET_SEEN_KEY)) || 0)) return false;
      store(RESET_SEEN_KEY, resetAt);
      // Every judge's saved scores on this phone
      try {
        Object.keys(localStorage).filter(k => k.startsWith(SCORES_KEY + '-')).forEach(k => {
          const saved = JSON.parse(localStorage.getItem(k) || '{}');
          Object.keys(saved).forEach(t => { if ((saved[t].savedAt || 0) < resetAt) delete saved[t]; });
          localStorage.setItem(k, JSON.stringify(saved));
        });
      } catch (e) {}
      Object.keys(allScores).forEach(t => { if ((allScores[t].savedAt || 0) < resetAt) delete allScores[t]; });
      queue = queue.filter(q => (q.queuedAt || 0) >= resetAt);
      saveQueue();
      teamCount = STARTING_TEAMS;
      store(TEAMS_KEY, teamCount);
      restoreNote = '';
      if (view === 'judge' && judgeName) { renderTeams(); showSyncStatus(); }
      return true;
    }

    // Pull this judge's scores back from the Sheet and merge them with what's on this phone.
    // For each team, whichever version was saved most recently wins.
    let restoreNote = '';
    async function restoreFromSheet() {
      if (!API_URL || !judgeName) return;
      const forName = judgeName;
      try {
        const res = await fetch(`${API_URL}?action=judge&name=${encodeURIComponent(forName)}&t=${Date.now()}`);
        const out = await res.json();
        if (!out.ok || forName !== judgeName) return;   // judge changed while loading
        applyReset(out.resetAt);
        const mine = (out.rows || []).filter(r => nameKey(String(r['Judge'] || '')) === nameKey(forName));
        let restored = 0;
        mine.forEach(r => {
          const teamNum = parseInt(String(r['Team']).replace(/\D/g, ''), 10);
          if (!teamNum) return;
          const savedAt = Date.parse(r['Last updated']) || 0;
          const local = allScores[teamNum];
          if (local && (local.savedAt || 0) >= savedAt) return;   // phone has the newer version
          const scores = {};
          for (let c = 1; c <= CATEGORIES; c++) scores[c] = Number(r[`Category ${c}`]) || 0;
          const tier = TIERS.find(t => t.label === r['Gut check']);
          const noteIds = [r['Keep doing'], r['Work on']].join('; ').split('; ')
            .map(text => (NOTES.find(n => n.text === text) || {}).id).filter(Boolean);
          allScores[teamNum] = {
            tier: tier ? tier.id : null,
            scores: scores,
            notes: noteIds,
            best: String(r['What worked'] || ''),
            improve: String(r['What to improve'] || ''),
            savedAt: savedAt,
            device: String(r['Device ID'] || deviceId)
          };
          restored++;
          if (teamNum > teamCount) { teamCount = teamNum; store(TEAMS_KEY, teamCount); }
        });
        if (restored) {
          saveAllScores();
          restoreNote = `Welcome back! Restored ${restored} scored team${restored > 1 ? 's' : ''}.`;
          renderTeams();
        }
        showSyncStatus();
      } catch (e) {
        restoreNote = "Couldn't check the Sheet for saved scores. Showing what's on this phone.";
        showSyncStatus();
      }
    }

    // ---------- Sending scores to the Google Sheet ----------
    // Every save goes into a queue on the phone first, then gets sent.
    // If the Wi-Fi drops, it stays in the queue and retries automatically.
    let queue = [];
    try { queue = JSON.parse(load(QUEUE_KEY)) || []; } catch (e) { queue = []; }
    let sending = false, lastError = false;

    function saveQueue() { store(QUEUE_KEY, JSON.stringify(queue)); }

    function buildPayload(teamNum, entry) {
      const noteText = type => NOTES.filter(n => n.type === type && entry.notes.includes(n.id)).map(n => n.text).join('; ');
      const scores = [];
      for (let c = 1; c <= CATEGORIES; c++) scores.push(entry.scores[c]);
      return {
        judge: judgeName,
        team: `Team ${teamNum}`,
        gut: entry.tier ? tierOf(entry.tier).label : '',
        scores: scores,
        total: totalOf(entry),
        keep: noteText('keep'),
        work: noteText('work'),
        best: entry.best || '',
        improve: entry.improve || '',
        device: entry.device || deviceId   // restored scores keep their original row
      };
    }

    function queueScore(teamNum, entry) {
      if (!API_URL) return;
      const payload = buildPayload(teamNum, entry);
      // If an older version of this same score is still waiting, replace it
      queue = queue.filter(q => !(q.device === payload.device && q.team === payload.team));
      payload.queuedAt = Date.now();
      queue.push(payload);
      saveQueue();
      sendQueue();
    }

    async function sendQueue() {
      if (!API_URL || sending) return;
      sending = true;
      showSyncStatus();
      while (queue.length) {
        try {
          const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(queue[0]) });
          const out = await res.json();
          if (!out.ok) throw new Error(out.error || 'Not saved');
          queue.shift();
          saveQueue();
          lastError = false;
        } catch (err) {
          lastError = true;
          break;   // try again later
        }
      }
      sending = false;
      showSyncStatus();
    }

    function showSyncStatus() {
      const el = $('sync-status');
      if (!el) return;
      if (!API_URL) { el.className = 'sync'; el.textContent = 'Not connected to the Google Sheet yet. Scores stay on this phone.'; return; }
      const mine = queue.filter(q => nameKey(q.judge || '') === nameKey(judgeName)).length;
      if (sending && mine) { el.className = 'sync'; el.textContent = 'Sending scores…'; }
      else if (mine) { el.className = 'sync warn'; el.textContent = `⚠ ${mine} score${mine > 1 ? 's' : ''} not sent yet. Will retry automatically.`; }
      else if (restoreNote) { el.className = restoreNote.startsWith('Welcome') ? 'sync ok' : 'sync warn'; el.textContent = restoreNote; }
      else if (Object.keys(allScores).length) { el.className = 'sync ok'; el.textContent = '✓ All your scores are saved'; }
      else { el.className = 'sync'; el.textContent = ''; }
    }

    setInterval(sendQueue, 10000);                 // retry every 10 seconds
    setInterval(() => { if (view === 'judge' && judgeName && !draft) restoreFromSheet(); }, 30000);  // pick up resets
    window.addEventListener('online', sendQueue);  // and as soon as Wi-Fi comes back

    function totalOf(entry) {
      return Object.values(entry.scores).reduce((sum, v) => sum + v, 0);
    }

    // The scoring sheet that's currently open (null when closed)
    let draft = null;

    // ---------- Elements ----------
    const $ = (id) => document.getElementById(id);
    const nameScreen = $('name-screen'), homeScreen = $('home-screen');
    const nameForm = $('name-form'), nameInput = $('name-input'), continueBtn = $('continue-btn');

    // ---------- Screens ----------
    function showNameScreen() {
      homeScreen.classList.add('hidden');
      nameScreen.classList.remove('hidden');
      nameInput.value = '';
      continueBtn.disabled = true;
      nameInput.focus();
    }

    function showHome(name) {
      $('hello-title').textContent = `Hi, ${name.split(' ')[0]}!`;
      nameScreen.classList.add('hidden');
      homeScreen.classList.remove('hidden');
      renderTeams();
      showSyncStatus();
    }

    function renderTeams() {
      $('team-count').textContent = `Teams (${teamCount})`;
      let html = '';
      for (let i = 1; i <= teamCount; i++) {
        // Only the last team can be removed, so the numbering never has gaps.
        const entry = allScores[i];
        const removable = i === teamCount && teamCount > 1 && !entry;
        const status = entry
          ? `<span class="status ${entry.tier || 'done'}">${entry.tier ? tierOf(entry.tier).label + ' · ' : ''}${totalOf(entry)}/${CATEGORIES * MAX_POINTS}</span>`
          : `<span class="status">Not judged</span>`;
        html += `
          <div class="row-wrap" style="display:flex;align-items:center;gap:6px">
            <button class="team" data-team="${i}">
              <span class="num">${i}</span>
              <span class="info"><b>Team ${i}</b></span>
              ${status}
            </button>
            ${removable ? `<button class="remove" data-remove="${i}" aria-label="Remove Team ${i}" title="Remove Team ${i}">×</button>` : (teamCount > 1 ? '<span style="width:32px;flex:none"></span>' : '')}
          </div>`;
      }
      $('team-list').innerHTML = html;
    }

    function addTeam() {
      teamCount++;
      store(TEAMS_KEY, teamCount);
      renderTeams();
      // Scroll the new team into view
      const last = document.querySelector(`[data-team="${teamCount}"]`);
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function removeLastTeam() {
      if (teamCount <= 1) return;
      teamCount--;
      store(TEAMS_KEY, teamCount);
      renderTeams();
    }

    // ---------- Scoring sheet ----------
    function openTeam(n) {
      const saved = allScores[n];
      draft = {
        team: n,
        scores: saved ? { ...saved.scores } : {},
        tier: saved ? (saved.tier || null) : null,
        notes: saved && saved.notes ? [...saved.notes] : [],
        best: saved ? (saved.best || saved.comment || '') : '',
        improve: saved ? (saved.improve || '') : ''
      };
      renderSheet();
    }

    function renderSheet() {
      if (!draft) { $('sheet').innerHTML = ''; return; }
      const oldSheet = document.querySelector('.sheet');
      const keepScroll = oldSheet ? oldSheet.scrollTop : 0;
      const scoredCount = Object.keys(draft.scores).length;
      const ready = scoredCount === CATEGORIES && !!draft.tier;
      const missing = [];
      if (!draft.tier) missing.push('gut check');
      if (scoredCount < CATEGORIES) missing.push(`${CATEGORIES - scoredCount} more ${CATEGORIES - scoredCount === 1 ? 'category' : 'categories'}`);
      const total = Object.values(draft.scores).reduce((a, b) => a + b, 0);

      let cats = '';
      for (let c = 1; c <= CATEGORIES; c++) {
        let buttons = '';
        for (let v = 1; v <= MAX_POINTS; v++) {
          const on = draft.scores[c] === v ? 'on' : '';
          buttons += `<button class="${on}" data-cat="${c}" data-val="${v}" aria-label="Category ${c}: ${v} points">${v}</button>`;
        }
        cats += `
          <div class="cat">
            <div class="cat-head">Category ${c} <span>out of ${MAX_POINTS}</span></div>
            <div class="scale">${buttons}</div>
          </div>`;
      }

      $('sheet').innerHTML = `
        <div class="sheet-bg" id="sheet-bg">
          <div class="sheet">
            <div class="sheet-top">
              <span class="num">${draft.team}</span>
              <h2>Team ${draft.team}</h2>
              <button class="cancel" id="close-sheet">Cancel</button>
            </div>
            ${cats}
            <div class="cat">
              <div class="cat-head">Feedback for the team <span>all optional</span></div>
              <div class="group keep">Keep doing</div>
              <div class="chips">${noteChips('keep')}</div>
              <div class="group work">Work on</div>
              <div class="chips">${noteChips('work')}</div>
            </div>
            <div class="cat">
              <div class="cat-head">In your own words <span>optional</span></div>
              <div class="field-label">What worked</div>
              <textarea id="best" maxlength="250" placeholder="The best part of your presentation was…">${escapeHtml(draft.best)}</textarea>
              <div class="field-label">What to improve</div>
              <textarea id="improve" maxlength="250" placeholder="You could consider improving…">${escapeHtml(draft.improve)}</textarea>
            </div>
            <div class="cat gut">
              <p class="gut-q">What's your gut feeling about Team ${draft.team}?</p>
              <div class="tiers">${TIERS.map(t => `<button class="tier ${t.id} ${draft.tier === t.id ? 'on' : ''}" data-tier="${t.id}"><b>${t.label}</b><span>${t.desc}</span></button>`).join('')}</div>
            </div>
            <div class="total"><span>Total</span><b>${total} / ${CATEGORIES * MAX_POINTS}</b></div>
            <button class="primary" id="save-score" ${ready ? '' : 'disabled'}>
              ${ready ? 'Save' : `To save, add: ${missing.join(' and ')}`}
            </button>
          </div>
        </div>`;
      const newSheet = document.querySelector('.sheet');
      if (newSheet) newSheet.scrollTop = keepScroll;
    }

    function noteChips(type) {
      return NOTES.filter(n => n.type === type).map(n => {
        const on = draft.notes.includes(n.id) ? 'on' : '';
        const sign = type === 'keep' ? '+' : '−';
        return `<button class="chip ${type} ${on}" data-note="${n.id}">${sign} ${n.text}</button>`;
      }).join('');
    }

    function saveScore() {
      if (!draft || Object.keys(draft.scores).length !== CATEGORIES || !draft.tier) return;
      const previous = allScores[draft.team];
      allScores[draft.team] = {
        savedAt: Date.now(),
        device: previous && previous.device ? previous.device : deviceId,
        tier: draft.tier,
        scores: draft.scores,
        notes: draft.notes,
        best: draft.best.trim(),
        improve: draft.improve.trim()
      };
      saveAllScores();
      restoreNote = '';
      queueScore(draft.team, allScores[draft.team]);
      draft = null;
      renderSheet();
      renderTeams();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    }

    function closeSheet() { draft = null; renderSheet(); }

    // ---------- Events ----------
    // Keep the comment in the draft as they type
    document.addEventListener('input', (e) => {
      if (!draft) return;
      if (e.target.id === 'best') draft.best = e.target.value;
      if (e.target.id === 'improve') draft.improve = e.target.value;
    });

    nameInput.addEventListener('input', () => {
      continueBtn.disabled = nameInput.value.trim().length < 2;
    });

    nameForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (name.length < 2) return;
      store(NAME_KEY, name);
      startJudge(name);
      restoreNote = API_URL ? 'Checking for your saved scores…' : '';
      showHome(name);
      restoreFromSheet().then(() => { if (restoreNote === 'Checking for your saved scores…') { restoreNote = ''; showSyncStatus(); } });
    });

    $('change-name').addEventListener('click', () => {
      // Switch judges. The previous judge's scores stay saved (on this phone and in the Sheet),
      // and come back when they enter their name again.
      forget(NAME_KEY);
      judgeName = ''; allScores = {}; restoreNote = '';
      showNameScreen();
    });
    $('add-team-top').addEventListener('click', addTeam);
    $('add-team-bottom').addEventListener('click', addTeam);

    document.addEventListener('click', (e) => {
      const team = e.target.closest('[data-team]');
      const remove = e.target.closest('[data-remove]');
      const point = e.target.closest('[data-cat]');
      const note = e.target.closest('[data-note]');
      const tierBtn = e.target.closest('[data-tier]');
      if (tierBtn && draft) {
        draft.tier = tierBtn.dataset.tier;
        renderSheet();
        return;
      }
      if (note && draft) {
        const id = note.dataset.note;
        draft.notes = draft.notes.includes(id) ? draft.notes.filter(x => x !== id) : [...draft.notes, id];
        renderSheet();
        return;
      }
      if (point && draft) {
        draft.scores[point.dataset.cat] = Number(point.dataset.val);
        renderSheet();
      }
      else if (e.target.closest('#save-score')) saveScore();
      else if (remove) removeLastTeam();
      else if (team) openTeam(Number(team.dataset.team));
      else if (e.target.id === 'close-sheet') closeSheet();
    });

    // ================= PANEL VIEW =================
    // Shows every judge's scores from the Google Sheet, behind a simple password.
    // Change the password here. Share it with judges once everyone is done scoring.
    const PANEL_PASSWORD = 'jam2026';
    const PANEL_KEY = 'bt-panel-unlocked';
    const panelUnlocked = () => load(PANEL_KEY) === PANEL_PASSWORD;
    const TIER_CLASS = { 'Standout': 'standout', 'Solid': 'solid', 'Needs work': 'needs' };
    const TIER_VALUE = { 'Standout': 3, 'Solid': 2, 'Needs work': 1 };
    let view = 'judge';
    let panelRows = null, panelUpdated = 0, panelError = '', panelTeam = null, panelLoading = false;
    const avgOf = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

    function setView(v) {
      view = v;
      document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
      document.querySelector('main').classList.toggle('wide', v === 'panel');
      if (v === 'panel') {
        nameScreen.classList.add('hidden');
        homeScreen.classList.add('hidden');
        $('panel-screen').classList.remove('hidden');
        renderPanel();
        loadPanel();
      } else {
        $('panel-screen').classList.add('hidden');
        closePanelTeam();
        const n = load(NAME_KEY);
        if (n) { if (!judgeName) startJudge(n); showHome(n); } else showNameScreen();
      }
    }

    async function loadPanel() {
      if (!API_URL || !panelUnlocked() || panelLoading) return;
      panelLoading = true;
      try {
        const res = await fetch(`${API_URL}?t=${Date.now()}`);
        const out = await res.json();
        if (!out.ok) {
          if (!panelRows) panelError = "Couldn't load scores.";
        } else {
          applyReset(out.resetAt);
          panelRows = out.rows || []; panelUpdated = Date.now(); panelError = '';
        }
      } catch (e) {
        if (!panelRows) panelError = "Couldn't reach the Google Sheet. Check the connection and try again.";
      }
      panelLoading = false;
      if (view === 'panel') {
        renderPanel();
        if (panelTeam) openPanelTeam(panelTeam);
      }
    }
    setInterval(() => { if (view === 'panel') loadPanel(); }, 10000);   // live: refresh every 10 seconds

    // Latest score per judge per team, grouped by judge name (capitals and spaces ignored)
    function panelEntries() {
      const latest = {};
      (panelRows || []).forEach(r => {
        const jk = nameKey(String(r['Judge'] || ''));
        const team = parseInt(String(r['Team']).replace(/\D/g, ''), 10);
        if (!jk || !team) return;
        const ts = Date.parse(r['Last updated']) || 0;
        const k = jk + '|' + team;
        if (latest[k] && latest[k].ts > ts) return;
        const scores = [];
        for (let c = 1; c <= CATEGORIES; c++) scores.push(Number(r[`Category ${c}`]) || 0);
        latest[k] = {
          jk, judge: String(r['Judge']).trim(), team, ts, gut: String(r['Gut check'] || ''), scores,
          total: scores.reduce((a, b) => a + b, 0),
          keep: String(r['Keep doing'] || ''), work: String(r['Work on'] || ''),
          best: String(r['What worked'] || ''), improve: String(r['What to improve'] || '')
        };
      });
      return Object.values(latest);
    }

    function panelStats() {
      const entries = panelEntries();
      const judges = [];
      entries.slice().sort((a, b) => a.ts - b.ts).forEach(e => {
        const j = judges.find(x => x.jk === e.jk);
        if (j) j.name = e.judge; else judges.push({ jk: e.jk, name: e.judge });
      });
      const teams = [...new Set(entries.map(e => e.team))].sort((a, b) => a - b);
      const totalTeams = Math.max(teamCount, ...teams, 1);
      // z-score: how far above/below that judge's own average a team scored
      judges.forEach(j => {
        const mine = entries.filter(e => e.jk === j.jk);
        const m = avgOf(mine.map(e => e.total));
        const sd = Math.sqrt(avgOf(mine.map(e => (e.total - m) ** 2)));
        j.n = mine.length; j.avg = m;
        j.byTeam = {};
        mine.forEach(e => j.byTeam[e.team] = { total: e.total, gut: e.gut, z: sd > 0 ? (e.total - m) / sd : 0 });
      });
      const rows = teams.map(t => {
        const js = judges.filter(j => j.byTeam[t]);
        return {
          team: t,
          raw: avgOf(js.map(j => j.byTeam[t].total)),
          z: avgOf(js.map(j => j.byTeam[t].z)),
          standouts: js.filter(j => j.byTeam[t].gut === 'Standout').length,
          votes: js.length
        };
      }).sort((a, b) => b.z - a.z);
      return { entries, judges, rows, totalTeams };
    }

    function renderPanel() {
      const el = $('panel-screen');
      if (!API_URL) { el.innerHTML = `<div class="card lockbox"><h1>Panel</h1><p>The app isn't connected to the Google Sheet yet.</p></div>`; return; }
      if (!panelUnlocked()) {
        el.innerHTML = `
          <div class="card lockbox">
            <h1>Panel</h1>
            <p>The panel is password protected. Organizers will share the password once judging is done.</p>
            <form id="unlock-form">
              <label for="panel-pass">Password</label>
              <input id="panel-pass" type="password" autocomplete="off">
              <button class="primary" type="submit">Unlock</button>
            </form>
            ${panelError ? `<p class="err">${escapeHtml(panelError)}</p>` : ''}
          </div>`;
        return;
      }
      if (!panelRows) { el.innerHTML = `<div class="card lockbox"><p style="margin:0">${panelError ? escapeHtml(panelError) : 'Loading scores…'}</p></div>`; return; }

      const D = panelStats();
      const table = D.rows.length ? `
        <div class="pscroll"><table class="ptable">
          <thead><tr><th>#</th><th>Team</th>${D.judges.map(j => `<th class="c">${escapeHtml(j.name)}</th>`).join('')}
            <th class="c">Avg total</th><th class="c">Z-score</th><th class="c">Standout votes</th></tr></thead>
          <tbody>${D.rows.map((x, i) => `
            <tr data-pteam="${x.team}">
              <td><b>${i + 1}</b></td>
              <td><span class="tlink">Team ${x.team}</span></td>
              ${D.judges.map(j => { const s = j.byTeam[x.team];
                  return `<td class="c">${s ? `<span class="tt ${TIER_CLASS[s.gut] || ''}" title="${escapeHtml(j.name)}: ${escapeHtml(s.gut)}">${s.total}</span>` : '<span class="tt none">–</span>'}</td>`; }).join('')}
              <td class="c">${x.raw.toFixed(1)}</td>
              <td class="c"><span class="zv ${x.z >= 0 ? 'pos' : 'neg'}">${x.z >= 0 ? '+' : ''}${x.z.toFixed(2)}</span></td>
              <td class="c">${x.standouts} of ${x.votes}</td>
            </tr>`).join('')}</tbody></table></div>
        <div class="legend"><span class="l1">Standout</span><span class="l2">Solid</span><span class="l3">Needs work</span></div>`
        : `<p class="note" style="color:var(--muted);margin:10px 0 0">No scores yet.</p>`;

      el.innerHTML = `
        <div class="ptop">
          <span class="live" id="panel-live"><span class="dot"></span><span id="panel-updated"></span></span>
          <button class="lock-btn" id="lock-panel">Lock panel</button>
        </div>
        <div class="jchips">${D.judges.map(j => `<span class="jchip"><b>${escapeHtml(j.name)}</b> ${j.n}/${D.totalTeams} teams · avg ${j.avg.toFixed(1)}/${CATEGORIES * MAX_POINTS}<span class="jbar"><i style="width:${Math.min(100, j.n / D.totalTeams * 100)}%"></i></span></span>`).join('')}</div>
        <div class="pcard"><h2>Live ranking</h2>${table}</div>
        <div class="reset-row"><button class="reset-btn" id="reset-open">Reset all data</button></div>`;
      updateLive();
    }

    function updateLive() {
      const t = $('panel-updated'); if (!t) return;
      const s = Math.round((Date.now() - panelUpdated) / 1000);
      t.textContent = s < 5 ? 'Live · updated just now' : `Live · updated ${s}s ago`;
      $('panel-live').classList.toggle('stale', s > 40);
    }
    setInterval(() => { if (view === 'panel') updateLive(); }, 1000);

    function openPanelTeam(team) {
      panelTeam = team;
      const D = panelStats();
      const rows = D.entries.filter(e => e.team === team);
      const cats = [];
      for (let c = 0; c < CATEGORIES; c++) cats.push({ label: `Category ${c + 1}`, v: avgOf(rows.map(e => e.scores[c])) });
      const worked = rows.filter(e => e.best.trim()), improve = rows.filter(e => e.improve.trim());
      // Quick-tap notes, with how many judges tapped each one
      const tally = field => {
        const count = {};
        rows.forEach(e => e[field].split('; ').map(t => t.trim()).filter(Boolean).forEach(t => count[t] = (count[t] || 0) + 1));
        return Object.entries(count).sort((a, b) => b[1] - a[1]);
      };
      const keepNotes = tally('keep'), workNotes = tally('work');
      const noteChips = (list, type) => list.map(([t, n]) =>
        `<span class="nchip ${type}">${type === 'keep' ? '+' : '−'} ${escapeHtml(t)}<small>${n} judge${n > 1 ? 's' : ''}</small></span>`).join('');
      $('panel-modal').innerHTML = `
        <div class="pm-bg" id="pm-bg"><div class="pm">
          <div class="sheet-top" style="margin-bottom:12px"><h2>Team ${team}</h2><button class="cancel" id="pm-close">Close</button></div>
          <div class="pcard"><h3>Average by category</h3>
            ${cats.map(c => `<div class="meter"><span class="lbl">${c.label}</span><span class="trk"><i style="width:${c.v / MAX_POINTS * 100}%"></i></span><span class="v">${c.v.toFixed(1)}</span></div>`).join('')}
          </div>
          <div class="pcard"><h3>Quick notes</h3>
            ${keepNotes.length || workNotes.length
              ? (keepNotes.length ? `<div class="ngroup keep">Keep doing</div><div class="nlist">${noteChips(keepNotes, 'keep')}</div>` : '') +
                (workNotes.length ? `<div class="ngroup work">Work on</div><div class="nlist">${noteChips(workNotes, 'work')}</div>` : '')
              : '<p style="margin:0">No quick notes yet.</p>'}
          </div>
          <div class="pcard"><h3>Judge comments</h3>
            ${worked.length || improve.length
              ? worked.map(e => `<div class="quote">${escapeHtml(e.best)}<small>${escapeHtml(e.judge)} · what worked</small></div>`).join('') +
                improve.map(e => `<div class="quote">${escapeHtml(e.improve)}<small>${escapeHtml(e.judge)} · what to improve</small></div>`).join('')
              : '<p style="margin:0">No comments yet.</p>'}
          </div>
        </div></div>`;
    }
    function closePanelTeam() { panelTeam = null; $('panel-modal').innerHTML = ''; }

    let resetError = '', resetting = false;
    function openReset() {
      panelTeam = null;
      $('panel-modal').innerHTML = `
        <div class="pm-bg" id="pm-bg"><div class="pm" style="max-width:420px">
          <div class="sheet-top" style="margin-bottom:8px"><h2>Reset all data?</h2><button class="cancel" id="pm-close">Cancel</button></div>
          <p style="margin:0 0 14px">This deletes <b>every judge's scores and comments</b> from the Google Sheet and from judges' phones, and resets the team list to Team 1–${STARTING_TEAMS}. A backup copy of the current scores is saved as a new tab in the Sheet.</p>
          <label for="reset-confirm">Type RESET to confirm</label>
          <input id="reset-confirm" type="text" autocomplete="off" autocapitalize="characters">
          <button class="primary danger" id="reset-go" disabled>${resetting ? 'Resetting…' : 'Delete all data'}</button>
          ${resetError ? `<p class="err">${escapeHtml(resetError)}</p>` : ''}
        </div></div>`;
    }
    async function doReset() {
      if (resetting) return;
      resetting = true; resetError = ''; openReset();
      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'reset', key: PANEL_PASSWORD }) });
        const out = await res.json();
        if (!out.ok) throw new Error(out.error === 'wrong-password'
          ? 'The Google Sheet script has a different password. Make sure PANEL_PASSWORD matches in both.'
          : (out.error || 'Reset failed'));
        applyReset(out.resetAt);
        resetting = false;
        closePanelTeam();
        panelRows = [];
        renderPanel();
        loadPanel();
      } catch (e) {
        resetting = false;
        resetError = /password/.test(e.message) ? e.message
          : "Couldn't reset. If you just updated the script, make sure you deployed a new version.";
        openReset();
      }
    }

    document.addEventListener('submit', (e) => {
      if (e.target.id !== 'unlock-form') return;
      e.preventDefault();
      const pass = $('panel-pass').value.trim();
      if (!pass) return;
      if (pass !== PANEL_PASSWORD) { panelError = "That password isn't right."; renderPanel(); return; }
      store(PANEL_KEY, pass);
      panelError = '';
      renderPanel();
      loadPanel();
    });
    document.addEventListener('input', (e) => {
      if (e.target.id === 'reset-confirm') $('reset-go').disabled = e.target.value.trim().toUpperCase() !== 'RESET';
    });
    document.addEventListener('click', (e) => {
      const tab = e.target.closest('[data-view]');
      const row = e.target.closest('[data-pteam]');
      if (tab) setView(tab.dataset.view);
      else if (row) openPanelTeam(Number(row.dataset.pteam));
      else if (e.target.id === 'pm-close' || e.target.id === 'pm-bg') closePanelTeam();
      else if (e.target.id === 'reset-open') { resetError = ''; openReset(); }
      else if (e.target.id === 'reset-go') doReset();
      else if (e.target.id === 'lock-panel') { forget(PANEL_KEY); panelRows = null; closePanelTeam(); renderPanel(); }
    });

    // ---------- Start ----------
    const saved = load(NAME_KEY);
    if (saved) { startJudge(saved); showHome(saved); sendQueue(); restoreFromSheet(); }
    else showNameScreen();
  </script>
</body>
</html>
