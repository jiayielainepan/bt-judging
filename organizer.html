<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Audience Choice: Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Innovation Jam logo colors */
    --blue:#0C3662; --blue-deep:#062F58; --blue-light:#2C61A1;
    --maize:#F1C319; --maize-soft:#FDF4CF;
    --bg:#F3F5F8; --card:#fff; --ink:#0C3662; --muted:#5B6B7F; --line:#DDE3EA;
    --accent:#0C3662; --accent-soft:#E4EBF4;
    --ok:#18794e; --ok-soft:#e3f4ea; --danger:#b42318; --danger-soft:#fde8e7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  header{background:var(--blue);color:#fff;padding:10px 16px;font-weight:700;border-bottom:4px solid var(--maize)}
  .hbar{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
  .brand{display:flex;align-items:center;min-width:0}
  .brand img{height:46px;width:auto;flex:none;display:block}
  .hright{margin-left:auto;font-size:13px;font-weight:600;color:var(--blue);background:var(--maize);border-radius:999px;padding:4px 12px}
  h1{font-size:24px;margin:0 0 6px}
  h2{font-size:17px;margin:0}
  p{margin:0 0 20px;color:var(--muted)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px}
  .link{color:var(--accent);font-size:14px;font-weight:600;padding:4px 0}
  @media (max-width:400px){ .brand img{height:40px} }
  main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  .lockbox{max-width:400px;margin:30px auto 0}
  label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus{outline:3px solid var(--maize-soft);border-color:var(--maize)}
  .primary{width:100%;margin-top:16px;padding:14px;border-radius:12px;background:var(--maize);color:var(--blue);font-weight:700}
  .err{color:var(--danger);font-size:14px;margin:10px 0 0}
  .ptop{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .ptop h1{margin:0}
  .live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .live .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .ptop .right{margin-left:auto;display:flex;gap:16px}
  .lock-btn{color:var(--muted);font-size:13px;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--maize);border-radius:14px;padding:14px 16px}
  .stat b{display:block;font-size:28px;line-height:1.15;color:var(--blue)}
  .stat span{font-size:13px;color:var(--muted)}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .pscroll{overflow-x:auto;margin-top:10px}
  .ptable{width:100%;border-collapse:collapse;font-size:14px}
  .ptable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ptable td{padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ptable .c{text-align:center;font-variant-numeric:tabular-nums}
  .ptable tr.win td{background:var(--maize-soft)}
  .tlink{font-weight:600}
  .zv{font-weight:700}
  .znote{font-size:12px;color:var(--muted);margin:10px 0 0}
  .znote.tie{color:var(--danger);font-size:13px}
  .switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
  .switch button{width:46px;height:26px;border-radius:999px;background:#c6ced8;position:relative;flex:none}
  .switch button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .switch button.on{background:var(--ok)}
  .switch button.on::after{left:23px}
  .reset-btn{color:var(--danger);font-size:13px;font-weight:600;padding:8px 12px;border:1px solid #f4c7c3;border-radius:10px;background:#fff}
  .reset-btn:hover{background:var(--danger-soft)}
  .bulk-btn{font-weight:700;color:var(--blue);background:var(--maize);border-radius:10px;padding:8px 14px;font-size:14px}
  .qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .qrcard{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .qrimg svg{width:100%;height:auto;display:block}
  .qrcard input{padding:8px 10px;font-size:15px;border-radius:10px}
  .qrmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
  .qrmeta button{color:var(--danger);font-size:12px;font-weight:600}
  .add-line{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1.5px dashed #c6ced8;color:var(--accent);font-weight:600}
  .add-line:hover{background:var(--accent-soft);border-color:var(--accent)}
  .pm-bg{position:fixed;inset:0;background:rgba(6,47,88,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
  .pm{background:var(--bg);width:100%;max-width:400px;border-radius:18px;padding:18px}
  .pm h2{margin-bottom:6px}
  .pm .btns{display:flex;justify-content:flex-end;align-items:center;gap:14px}
  .pm .btns .link{color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:40}
  #print{display:none}
  @media (max-width:560px){ .hide-sm{display:none} .stat b{font-size:22px} }
  @media print{
    html,body{background:#fff}
    header,#app,#modal,.toast{display:none!important}
    #print{display:block}
    .sign{page-break-after:always;break-after:page;height:95vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;color:#0C3662}
    .sign img{width:60vw;max-width:460px;height:auto}
    .sign .aw{font-size:18px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#2C61A1;margin-top:10px}
    .sign h1{font-size:56px;margin:0}
    .sign .qrimg{width:58vw;max-width:420px}
    .sign p{font-size:24px;font-weight:600;margin:0;color:#0C3662}
  }
</style>
</head>
<body>
<header><div class="hbar">
  <div class="brand"><img src="assets/logo-white.png" alt="Business+Tech Innovation Jam"></div>
  <div class="hright">Organizer</div>
</div></header>
<main id="app"></main>
<div id="modal"></div>
<div id="print"></div>
<script src="audience-config.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pin = null; try{ pin = sessionStorage.getItem('jamac-pin'); }catch(e){}
let data = null, timer = null, busy = false;

async function api(params, post){
  let r;
  if(post) r = await fetch(API_URL, { method:'POST', body: JSON.stringify(params) });
  else r = await fetch(API_URL + '?' + new URLSearchParams(params));
  const j = await r.json();
  if(j.ok === false) throw new Error(j.error || 'Something went wrong');
  return j;
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

/* ---------- PIN ---------- */
function renderPin(error){
  $app.innerHTML = `<section class="card lockbox">
    <h1>Organizer</h1><p>Enter the organizer PIN to see Audience Choice results.</p>
    <form onsubmit="event.preventDefault(); login(this.pin.value)">
      <label for="pin">PIN</label>
      <input id="pin" name="pin" inputmode="numeric" autocomplete="off" maxlength="8" autofocus>
      ${error?`<p class="err">${esc(error)}</p>`:''}
      <button class="primary">Open results</button>
    </form></section>`;
}
async function login(p){
  try{
    data = await api({ action:'results', pin:p });
    pin = p; try{ sessionStorage.setItem('jamac-pin', p); }catch(e){}
    render(); startPolling();
  }catch(e){
    renderPin(/pin/i.test(e.message) ? 'That PIN is not right.' : "Couldn't reach the Google Sheet. Check API_URL in audience-config.js.");
  }
}

/* ---------- results ---------- */
function startPolling(){ clearInterval(timer); timer = setInterval(refresh, 15000); }
async function refresh(manual){
  if(busy || document.querySelector('input:focus')) return;
  try{ data = await api({ action:'results', pin }); render(); if(manual) toast('Updated'); }
  catch(e){ if(/pin/i.test(e.message)){ clearInterval(timer); renderPin(); } else if(manual) toast("Couldn't refresh"); }
}
async function admin(params, msg){
  busy = true;
  try{ data = await api({ ...params, pin }, true); render(); if(msg) toast(msg); }
  catch(e){ toast(e.message); }
  finally{ busy = false; }
}

function qrSvg(text){
  try{ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
  catch(e){ return ''; }
}
const audienceUrl = code => new URL('audience.html', location.href).href.split('#')[0] + '#b-' + code;
const fmt = v => v==null ? '–' : v.toFixed(2);

function render(){
  const d = data, rows = d.rows, any = d.totalRatings > 0;
  const tie = any && rows.length > 2 && rows[2].ratings > 0 && Math.abs(rows[1].adjusted - rows[2].adjusted) < 1e-9;
  $app.innerHTML = `
    <div class="ptop"><h1>Audience Choice results</h1>
      <span class="live"><span class="dot"></span>Last updated: ${new Date(d.updated).toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'})}</span>
      <span class="right"><button class="lock-btn" onclick="refresh(true)">Refresh</button><button class="lock-btn" onclick="logout()">Lock</button></span></div>

    <div class="stats">
      <div class="stat"><b>${d.totalRatings}</b><span>ratings</span></div>
      <div class="stat"><b>${d.phones}</b><span>phones voted</span></div>
      <div class="stat"><b>${d.phones ? (d.totalRatings/d.phones).toFixed(1) : '0'}</b><span>teams rated per phone</span></div>
    </div>

    <div class="pcard">
      <div class="phead">
        <div class="switch"><button class="${d.open?'on':''}" onclick="admin({action:'setOpen', open:${!d.open}}, '${d.open?'Voting closed':'Voting opened'}')" aria-label="Voting open"></button>Voting is ${d.open?'open':'closed'}</div>
        <button class="reset-btn" onclick="askClear()">Reset all votes</button>
      </div>
      <div class="pscroll"><table class="ptable">
        <thead><tr><th>#</th><th>Team</th><th class="c hide-sm">Visits</th><th class="c">Ratings</th>
          <th class="c hide-sm">Would pay</th><th class="c hide-sm">Demo</th><th class="c">Adjusted avg</th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr class="${i<2&&any?'win':''}">
          <td>${i+1}</td><td><span class="tlink">${esc(r.name)}</span></td>
          <td class="c hide-sm">${r.visits}</td><td class="c">${r.ratings}</td>
          <td class="c hide-sm">${fmt(r.pay)}</td><td class="c hide-sm">${fmt(r.demo)}</td>
          <td class="c zv">${fmt(r.adjusted)}</td></tr>`).join('')}</tbody>
      </table></div>
      ${tie?`<p class="znote tie">2nd and 3rd place are tied. Decide together how to break the tie.</p>`:''}
    </div>

    <div class="pcard">
      <div class="phead"><h2>Teams and booth QR codes</h2><button class="bulk-btn" onclick="printSigns()">Print QR signs</button></div>
      <div class="qrgrid">${d.teams.map(t=>`<div class="qrcard">
        <div class="qrimg">${qrSvg(audienceUrl(t.code))}</div>
        <input value="${esc(t.name)}" aria-label="Team name"
          onkeydown="if(event.key==='Enter')this.blur()"
          onchange="this.value.trim() && admin({action:'rename', code:'${t.code}', name:this.value}, 'Name saved')">
        <div class="qrmeta"><span>#b-${t.code}</span><button onclick="askRemove('${t.code}')">Remove</button></div>
      </div>`).join('')}</div>
      <button class="add-line" onclick="admin({action:'addTeam'}, 'Team added')">+ Add team</button>
    </div>`;
}

function printSigns(){
  document.getElementById('print').innerHTML = data.teams.map(t=>`<div class="sign">
    <img src="assets/logo-blue.png" alt="Business+Tech Innovation Jam">
    <div class="aw">Audience Choice</div>
    <h1>${esc(t.name)}</h1>
    <div class="qrimg">${qrSvg(audienceUrl(t.code))}</div>
    <p>Scan to rate this team</p></div>`).join('');
  const img = new Image(); img.onload = img.onerror = () => window.print(); img.src = 'assets/logo-blue.png';
}

function modal(html){ document.getElementById('modal').innerHTML = `<div class="pm-bg" onclick="if(event.target===this)closeModal()"><div class="pm">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal').innerHTML = ''; }
function askRemove(code){
  const t = data.teams.find(t=>t.code===code);
  modal(`<h2>Remove ${esc(t.name)}?</h2><p class="sub">Its QR code will stop working and its votes won't count.</p>
    <div class="btns"><button class="link" onclick="closeModal()">Cancel</button>
    <button class="reset-btn" onclick="closeModal(); admin({action:'removeTeam', code:'${code}'}, 'Team removed')">Remove team</button></div>`);
}
function askClear(){
  modal(`<h2>Reset all votes?</h2><p class="sub">This clears every rating and booth visit, and phones forget what they rated. The ratings are first copied to a backup tab in the Google Sheet. Team names and QR codes stay.</p>
    <div class="btns"><button class="link" onclick="closeModal()">Cancel</button>
    <button class="reset-btn" onclick="closeModal(); admin({action:'clear'}, 'All votes reset')">Reset all votes</button></div>`);
}
function logout(){ try{ sessionStorage.removeItem('jamac-pin'); }catch(e){} pin=null; clearInterval(timer); renderPin(); }

if(pin) login(pin); else renderPin();
</script>
</body>
</html>
